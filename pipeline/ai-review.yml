# AI review for pull requests: deterministic checks first (required), then an advisory AI comment.
# Lives in pipeline/ so it never runs in the course repo; copy it to .github/workflows/ in your fork.
# Threat model and settings: docs/pipeline.md.

name: AI review

on:
  pull_request: # not pull_request_target: forks get no secrets and a read-only token; same-repo PRs run their own copy of this file
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {} # every job asks for exactly what it needs

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests # the required check in branch protection: keep the name stable, gates are listed in docs/pipeline.md; no `if`/`needs`, so it is never skipped
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # HEAD is the merge commit: HEAD^1 = base, HEAD^2 = PR head
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Диф PR як текст
        # --text: a .gitattributes from the PR cannot hide changes as "binary"
        run: |
          git diff --text --no-ext-diff --no-textconv -U0 HEAD^1 HEAD -- app > "$RUNNER_TEMP/app.diff"
          git diff --text --no-ext-diff --no-textconv -U0 HEAD^1 HEAD -- app/src > "$RUNNER_TEMP/src.diff"

      - name: R14 — без залежностей, lock-файлів, node_modules і .env
        run: |
          for f in $(git ls-files -- 'app/*package.json'); do
            node -e '
              const p = require(process.argv[1]);
              const deps = Object.keys(p).filter((k) => /dependencies$/i.test(k) && Object.keys(p[k] ?? {}).length);
              if (deps.length) { console.log(`::error file=${process.argv[2]}::R14: ${deps.join(", ")}`); process.exit(1); }' "./$f" "$f"
          done
          if git ls-files app | grep -E '(^|/)(node_modules/|(package-lock\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml|bun\.lockb?)$)'; then
            echo "::error::R14: lock-файл чи node_modules в app/"
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env($|\.)'; then
            echo "::error::R14: файл .env* у репо"
            exit 1
          fi

      - name: R14 — секрети в комітах PR (gitleaks)
        run: |
          rm -f .gitleaks.toml .gitleaksignore # a PR must not bring its own allowlist
          # --ignore-gitleaks-allow: nor allow a secret line by line with an inline gitleaks:allow comment
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            zricethezav/gitleaks:v8.18.4@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba \
            detect --source=/repo --log-opts="--text HEAD^1..HEAD^2" --redact --no-banner --ignore-gitleaks-allow

      - name: Сигнал R6 — змінено export без запису в CHANGELOG (не блокує)
        # A new exported function is a gate (last step); any other changed export line is only a signal:
        # renaming a parameter changes the line, not the contract.
        run: |
          # Export lines per file, without comments and extra spaces: a comment or whitespace edit is not a change.
          exports() { git show "$1:$2" 2>/dev/null | grep -E '^[[:space:]]*export\b' | sed -E 's#[[:space:]]*//.*##; s#[[:space:]]+# #g; s#^ ##' | sort || true; }
          changed=""
          for f in $(git diff --no-renames --name-only HEAD^1 HEAD -- app/src); do
            [ "$(exports HEAD^1 "$f")" = "$(exports HEAD "$f")" ] || changed="$changed $f"
          done
          if [ -n "$changed" ] && git diff --quiet HEAD^1 HEAD -- app/CHANGELOG.md; then
            echo "::warning file=app/CHANGELOG.md::R6: змінено export у${changed}, а CHANGELOG — ні; перевірте"
          fi

      - name: Сигнал R5 — дати в локальному часі (не блокує)
        # A signal, not a gate: a text match is not always a call, e.g. a method name inside a template literal.
        run: |
          # Matched lines come from the PR, so they cannot be workflow commands: the runner finds "##[" anywhere in
          # a line and also splits a line at a bare CR, so "::" and "##[" are broken up before the prefix is added.
          quote() { sed -e 's/::/: :/g' -e 's/##\[/## [/g' -e "s/^/$1> /"; }
          # String literals first: a date method named in a string is not a call, and "//" in a string is not a comment.
          if found=$(sed -n 's#"[^"]*"#""#g; s#\x27[^\x27]*\x27#\x27\x27#g; s#//.*$##; /^+[^+]/p' "$RUNNER_TEMP/src.diff" \
             | grep -E '\.(get(Date|Day|Month|FullYear)|toLocaleDateString)\(|new Date\([[:space:]]*[[:alnum:]_$.]+[[:space:]]*,'); then
            printf '%s\n' "$found" | quote R5
            echo "::warning::R5: обчислення дат у локальному часі — перевірте"
          fi

      - name: Сигнали для рев'юера (R4, R11, R12) — не блокують
        env: # PR fields are untrusted: only through env, never ${{ }} inside the script
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          export LC_ALL=C.UTF-8
          quote() { sed -e 's/::/: :/g' -e 's/##\[/## [/g' -e "s/^/$1> /"; } # as in the R5 step
          if found=$(sed -n 's#//.*$##; /^+[^+]/p' "$RUNNER_TEMP/src.diff" | grep -E 'грн|toFixed|Intl\.NumberFormat'); then
            printf '%s\n' "$found" | quote R4
            echo "::warning::R4: форматування грошей в app/src — перевірте"
          fi
          if found=$(grep -E '^\+[^+]' "$RUNNER_TEMP/app.diff" | grep -iE '\b(AI|LLM|reviewers?)\b|рев.{1,3}юер|eslint-disable|nosemgrep'); then
            printf '%s\n' "$found" | quote R11
            echo "::warning::R11: текст, звернений до інструментів чи рев'юерів"
          fi
          # The same words in the title or description are R12 (in code, R11).
          if found=$(printf '%s\n' "$PR_TITLE" "$PR_BODY" | grep -iE '\b(AI|LLM|reviewers?)\b|рев.{1,3}юер|eslint-disable|nosemgrep'); then
            printf '%s\n' "$found" | quote R12
            echo "::warning::R12: текст, звернений до інструментів чи рев'юерів, у назві чи описі PR"
          fi

      - name: R13 — увесь набір тестів, нічого не вимкнено
        # After the text checks, because it runs the PR's code. `node --test`, not `npm test`: the PR's scripts.test is not trusted.
        working-directory: app
        run: |
          node --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination="$RUNNER_TEMP/r13.tap"
          if grep -E '^# (skipped|todo) [1-9]' "$RUNNER_TEMP/r13.tap"; then
            echo "::error::R13: тест вимкнено (skip/todo)"
            exit 1
          fi

      - name: R6 — нова експортована функція без запису в CHANGELOG
        # After R13: it imports the PR's modules, so it runs PR code too. Node reads the exports itself, so a comment,
        # a string or a renamed parameter cannot trip it; a name the base exports from any module is not new, so
        # neither can a moved file or function. Classes and constants are left to the R6 signal. Modules are imported
        # from app/, as R13 imports them; one that cannot be imported gives a warning, since the gate cannot tell.
        run: |
          git diff --quiet HEAD^1 HEAD -- app/CHANGELOG.md || exit 0 # an entry exists; whether it is true is for the reviewer
          mkdir -p "$RUNNER_TEMP/base" && git archive HEAD^1 app | tar -x -C "$RUNNER_TEMP/base"
          git diff --no-renames --name-only -z --diff-filter=d HEAD^1 HEAD -- 'app/src/*.js' 'app/src/*.mjs' \
            | node --input-type=module -e '
                import { readdirSync, readFileSync } from "node:fs";
                import { pathToFileURL } from "node:url";
                const load = (file) => import(pathToFileURL(file).href);
                const isFunction = (v) => typeof v === "function" && !/^class\b/.test(Function.prototype.toString.call(v));
                const root = process.cwd(), baseApp = `${process.argv[1]}/app`;
                const known = new Set(); // every name the base exports, from any module in app/src
                process.chdir(baseApp);
                for (const f of readdirSync("src", { recursive: true }).filter((f) => /\.m?js$/.test(f)))
                  for (const name of Object.keys(await load(`${baseApp}/src/${f}`))) known.add(name);
                process.chdir(`${root}/app`);
                let found = 0;
                for (const f of readFileSync(0, "utf8").split("\0").filter(Boolean)) {
                  const after = await load(`${root}/${f}`).catch((e) => {
                    console.log(`::warning file=${f}::R6: модуль не імпортується, нові експорти не перевірено: ${String(e?.message).replace(/\s+/g, " ")}`);
                    return {};
                  });
                  const added = Object.keys(after).filter((name) => isFunction(after[name]) && !known.has(name));
                  if (added.length) { console.log(`::error file=${f}::R6: нова експортована функція ${added.join(", ")}, а CHANGELOG — ні`); found++; }
                }
                process.exit(found ? 1 : 0);' "$RUNNER_TEMP/base"

  review:
    name: AI-рев'ю # advisory: NOT a required check; its verdict never blocks a merge
    needs: tests # AI only after green deterministic checks
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft # not a fork
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # no write: this job holds the model key
    outputs:
      reviewed: ${{ steps.prepare.outputs.reviewed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the merge commit and its parents: HEAD^1 = base
          persist-credentials: false

      - name: Диф PR як дані, рев'юер — з бази
        id: prepare
        env: # PR fields are untrusted: only through env, never ${{ }} inside the script
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          git diff --text --no-ext-diff --no-textconv HEAD^1 HEAD -- app > "$RUNNER_TEMP/change.diff"
          # The reviewer (script, prompt, standard) and app/ come from the base, not from the PR.
          git checkout --quiet --detach HEAD^1
          skip=""
          [ -s "$RUNNER_TEMP/change.diff" ] || skip="змін в app/ немає"
          [ -f review/run-review.mjs ] || skip="у базовій гілці немає рев'юера"
          [ "$HAS_KEY" = "true" ] || skip="секрет ANTHROPIC_API_KEY не налаштовано"
          if [ -n "$skip" ]; then
            echo "::notice::AI-рев'ю пропущено: $skip"
            echo "reviewed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -rf review-queue && mkdir -p "review-queue/pr-$PR_NUMBER"
          mv "$RUNNER_TEMP/change.diff" "review-queue/pr-$PR_NUMBER/change.diff"
          printf '# PR-%s: %s\n\n%s\n' "$PR_NUMBER" "$PR_TITLE" "$PR_BODY" > "review-queue/pr-$PR_NUMBER/PR.md"
          echo "reviewed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.prepare.outputs.reviewed == 'true'
        with:
          node-version: 22
          package-manager-cache: false

      - name: Claude Code CLI (закріплена версія)
        if: steps.prepare.outputs.reviewed == 'true'
        working-directory: ${{ runner.temp }} # outside the checkout: no project .npmrc
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.302
          claude --version

      - name: AI-рев'ю в ізольованій сесії лише для читання
        if: steps.prepare.outputs.reviewed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # only in this step
          DISABLE_AUTOUPDATER: "1"
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node review/run-review.mjs "$PR_NUMBER" --tag ci
          report="review-runs/pr-$PR_NUMBER.ci.md"
          # Before the report leaves this job: an artifact can be downloaded for days.
          if grep -qE 'sk-ant-[A-Za-z0-9_-]{10,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' "$report"; then
            rm -f "$report"
            echo "::error::Звіт містить рядок, схожий на секрет, — не публікуємо"
            exit 1
          fi
          cp "$report" "$RUNNER_TEMP/ai-review.md"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.prepare.outputs.reviewed == 'true'
        with:
          name: ai-review
          path: ${{ runner.temp }}/ai-review.md
          retention-days: 7
          if-no-files-found: error

  comment:
    name: Дорадчий коментар
    needs: review
    if: needs.review.outputs.reviewed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # only to leave a comment; no secrets, no checkout
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-review
          path: ${{ runner.temp }}/ai-review

      - name: Опублікувати звіт як коментар
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "> **AI-рев'ю — дорадче.** Не блокує злиття й не замінює тести; злиття затверджує людина."
            echo "> Знахідки — гіпотези моделі: перевіряйте їх за кодом. Відсутня знахідка — не доказ, що дефекту немає."
            echo
            sed 's/@/@\xE2\x80\x8B/g' "$RUNNER_TEMP/ai-review/ai-review.md" # no @-mentions from model output
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
